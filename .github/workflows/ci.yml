name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, generated sources, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tecton vendor checksums and generated theme are current
        run: pnpm tecton:check
      - name: Export inventory is current
        run: pnpm inventory:check
      - name: Unit, component and API tests with coverage (80% gate)
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    name: Build, packaging and bundle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tecton-mui/ui build
      - run: pnpm --filter @tecton-mui/mcp build
      - name: Exports map, Node ESM/SSR imports, tree shaking, stylesheets
        run: pnpm test:bundle
      - name: License notices present in package
        run: test -f packages/ui/THIRD_PARTY_NOTICES.md && test -f packages/ui/README.md

  e2e:
    name: Browser tests (interactions, a11y, RTL, light/dark, SSR, visual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  docs:
    name: Documentation static build, examples and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (API generation, prerender, Pagefind index, link check)
        run: pnpm --filter @tecton-mui/docs build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
      - name: Documentation sync manifest is consistent
        run: pnpm docs:sync --check
